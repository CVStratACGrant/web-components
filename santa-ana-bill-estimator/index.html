<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposed Water Rate Estimator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* New Colors from image */
            --dark-text-color: #183e63; /* Dark Blue/Gray */
            --primary-color: #183e63;
            --background-color: #f9fafb00;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: #1F2937;
        }
        .card {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #E5E7EB;
            height:fit-content;
        }
        .input-style {
            padding: 0.75rem;
            border: 1px solid #D1D5DB;
            border-radius: 0.375rem;
            transition: all 0.2s;
            appearance: none;
        }
        .input-style:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(252, 163, 17, 0.5);
        }
        #yearTabs {
            border-radius: 15px 15px 0 0;
            border: 1px solid #E5E7EB;
        }
        .tab {
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            border-bottom: 3px solid transparent;
            font-weight: 600;
            color: #4B5563;
            border: 0.5px solid #E5E7EB;

        }
        @media (min-width: 768px) {
            .tab {
                border-radius: 15px 15px 0 0;
                border: 1px solid #E5E7EB;
            }
            #yearTabs{
                border: none;
            }
        }
        .tab:hover {
            background-color: #F3F4F6;
        }
        .tab.active {
            color: var(--dark-text-color);
            border-color: #bfdbfe;
            background-color: #f0f6ff;
        }
        .status-positive {
            color: #10B981;
        }
        .status-negative {
            color: #EF4444;
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div id="app" class="space-y-8">
        
        <div>
            <div class="card bg-white p-6 sm:p-8 rounded-xl">
                <h2 class="text-xl font-bold border-b pb-2 mb-4" style="color: var(--dark-text-color);">Input Parameters</h2>
                <div class="space-y-6">

                    <p style="color:hotpink">Note explaining that customer class no longer applies anymore?</p>

                    <div id="customerClassContainer" class="lg:flex lg:space-x-4 lg:space-y-0 space-y-6">
                        <div class="lg:w-1/2">
                            <label for="customerClass" class="block text-sm font-medium text-gray-700 mb-1">
                                Customer Class
                            </label>
                            <select id="customerClass" class="w-full input-style bg-white">
                                <option value="Single Family" selected>Single Family</option>
                                <option value="Multi-Family">Multi-Family</option>
                                <option value="Non-Residential">Non-Residential</option>
                            </select>
                        </div>
                        
                        <div id="multiFamilyUnitsDiv" class="lg:w-1/2 hidden">
                            <label for="multiFamilyUnits" class="block text-sm font-medium text-gray-700 mb-1">
                                Number of Dwelling Units
                            </label>
                            <input type="number" id="multiFamilyUnits" value="2" min="2" step="1" class="w-full input-style">
                        </div>
                    </div>

                    <div>
                        <label for="meterSize" class="block text-sm font-medium text-gray-700 mb-1">Meter Size</label>
                        <select id="meterSize" class="w-full input-style bg-white">
                            <option value="5/8&quot; X 3/4&quot;" selected>5/8" X 3/4"</option>
                            <option value="3/4&quot;">3/4"</option>
                            <option value="1&quot;">1"</option>
                            <option value="1 1/2&quot;">1 1/2"</option>
                            <option value="2&quot;">2"</option>
                            <option value="3&quot;">3"</option>
                            <option value="4&quot;">4"</option>
                            <option value="6&quot;">6"</option>
                            <option value="8&quot;">8"</option>
                            <option value="10&quot;">10"</option>
                            <option value="12&quot;">12"</option>
                        </select>
                    </div>

                    <div class="lg:grid lg:grid-cols-2 lg:gap-4 space-y-6 lg:space-y-0">
                        <div>
                            <label for="potableUsage" class="block text-sm font-medium text-gray-700 mb-1">Potable Usage (ccf)</label>
                            <input type="number" id="potableUsage" value="20" min="0" step="1" class="w-full input-style">
                            <p class="text-xs text-gray-500 mt-1">ccf = 100 cubic feet</p>
                        </div>

                        <div>
                            <label for="recycledUsage" class="block text-sm font-medium text-gray-700 mb-1">Recycled Usage (ccf)</label>
                            <input type="number" id="recycledUsage" value="0" min="0" step="1" class="w-full input-style">
                        </div>
                    </div>

                    <div class="space-y-2 pt-2 border-t border-gray-200">
                        <p class="text-sm font-medium text-gray-700">Additional Charges:</p>
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="fireLine" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            <label for="fireLine" class="text-sm font-medium text-gray-700">Include Fire Line</label>
                        </div>
                        
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="fogCharge" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            <label for="fogCharge" class="text-sm font-medium text-gray-700">Include FOG Charge</label>
                        </div>
                    </div>
                </div>

                <button id="calculateButton" 
                class="w-full mt-8 py-3 px-4 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg shadow-md transition-colors duration-200"
                onclick="calculateBill()">
                    Calculate Bill Estimate
                </button>
            </div>
        </div>

        <div>
            <div id="yearTabs" class="flex flex-col sm:flex-row justify-start bg-white border-b border-gray-200 rounded-t-xl overflow-hidden">
                </div>

            <div class="card bg-white p-6 sm:p-8 rounded-b-xl border-t-0">
                <div id="inputSummary" class="mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                    </div>

                <div id="detailedResults" class="space-y-3">
                    <p class="text-center text-gray-500">Press 'Calculate Bill Estimate' to see the detailed breakdown.</p>
                </div>
                
                <div id="totalSection" class="mt-6">
                    </div>
            </div>
        </div>
    </div>

<script src="const.js"></script>
<script src="script.js" type="module"></script>
<script>
    // --- JS for # of Units visibility ---
    document.addEventListener('DOMContentLoaded', () => {
        const customerClassSelect = document.getElementById('customerClass');
        const unitsDiv = document.getElementById('multiFamilyUnitsDiv');

        const toggleUnitsVisibility = () => {
            if (customerClassSelect.value === 'Multi-Family' || customerClassSelect.value === 'Multi Family') {
                unitsDiv.classList.remove('hidden');
                // Ensure the value is at least 2 for Multi-Family
                const unitsInput = document.getElementById('multiFamilyUnits');
                if (parseInt(unitsInput.value) < 2) {
                    unitsInput.value = 2;
                }
            } else {
                unitsDiv.classList.add('hidden');
            }
        };

        // Attach event listener
        customerClassSelect.addEventListener('change', toggleUnitsVisibility);

        // Initial check on page load (important for initial calculation logic)
        toggleUnitsVisibility();
    });
</script>

</body>
</html>
